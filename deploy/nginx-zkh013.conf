# /etc/nginx/sites-available/zkh013 — сайт (Next.js, 127.0.0.1:3000) болон серверт хадгалсан файлууд

# Интернэтээс ирэх хүсэлтийг Cloudflare Tunnel (cloudflared) серверийн дотроос 127.0.0.1-ээр дамжуулна —
# тэдгээр нь зочин талдаа HTTPS-ээр ирсэн. Дотоод сүлжээнээс шууд ирсэн хүсэлт хэвээрээ.
map $realip_remote_addr $forwarded_proto {
    127.0.0.1 https;
    default   $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    # nginx-ийн хувилбарыг хариунд зарлахгүй
    server_tokens off;

    # Tunnel-ээр ирсэн зочны жинхэнэ IP (холбоо барих формын хязгаарт хэрэгтэй) — зөвхөн 127.0.0.1-д итгэнэ
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Файлыг 4MB-аар хэсэгчлэн оруулдаг тул том бичлэгт ч энэ хангалттай
    client_max_body_size 20M;

    # Серверт хадгалсан зураг, бичлэг, сургалтын файл — дискнээс шууд (бичлэгийг гүйлгэх Range-тэй)
    location /uploads/ {
        alias /srv/zkh013/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        types {
            image/jpeg jpg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
            application/pdf pdf;
            application/msword doc;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
            application/vnd.ms-powerpoint ppt;
            application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
            application/vnd.ms-excel xls;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
        }
        default_type application/octet-stream;
        location ~ /\. { deny all; }
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Хэрэглэгчийн өгсөн X-Forwarded-For-ийг дарж бичнэ — холбоо барих формын хязгаар IP-гаар ажилладаг
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }
}
